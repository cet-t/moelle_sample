[package]
name = "fil_sample"
version = "0.1.0"
edition = "2024"

[dependencies]
fil = { version = "0.1.0", optional = true }
thiserror = { version = "2", optional = true }

[features]
choice = ["dep:fil"]
sampler = ["dep:fil", "dep:thiserror"]

[dev-dependencies]
fil_a = { git = "https://github.com/cet-t/fil_a", features = ["sfc"] }
