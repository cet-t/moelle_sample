[package]
name = "moelle_sample"
version = "0.1.1"
edition = "2024"

[dependencies]
moelle = { version = "0.1", optional = true }
thiserror = { version = "2", optional = true }

[features]
choice = ["dep:moelle"]
sampler = ["dep:moelle", "dep:thiserror"]
shuffle = ["dep:moelle"]

[dev-dependencies]
moelle_a = { git = "https://github.com/cet-t/moelle_a", features = ["sfc"] }
